[project]
name = "hospital-ai-chatbot"
version = "0.1.0"
description = "Hospital AI Assistant with Agentic RAG, Memory, and Guardrails — YZV445E Project 2"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.3.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.4.0",
    "langgraph>=1.2.0",
    "litellm>=1.83.14",
    "pydantic>=2.12.5",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "streamlit>=1.57.0",
]

[project.scripts]
ingest = "rag.ingest:main"
chat = "app.main:cli_mode"
